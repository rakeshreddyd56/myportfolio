<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="walmartGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0071ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004c91;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main spark/star design -->
  <g transform="translate(50,50)">
    <!-- Large rays -->
    <path d="M 0,-25 L 3,-8 L 0,-6 L -3,-8 Z" fill="url(#walmartGradient)" transform="rotate(0)"/>
    <path d="M 0,-25 L 3,-8 L 0,-6 L -3,-8 Z" fill="url(#walmartGradient)" transform="rotate(60)"/>
    <path d="M 0,-25 L 3,-8 L 0,-6 L -3,-8 Z" fill="url(#walmartGradient)" transform="rotate(120)"/>
    <path d="M 0,-25 L 3,-8 L 0,-6 L -3,-8 Z" fill="url(#walmartGradient)" transform="rotate(180)"/>
    <path d="M 0,-25 L 3,-8 L 0,-6 L -3,-8 Z" fill="url(#walmartGradient)" transform="rotate(240)"/>
    <path d="M 0,-25 L 3,-8 L 0,-6 L -3,-8 Z" fill="url(#walmartGradient)" transform="rotate(300)"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="url(#walmartGradient)"/>
  </g>
</svg> 