<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="greyAtomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nucleusGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="electronGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Atomic structure design -->
  <g transform="translate(50,50)">
    <!-- Electron orbits -->
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="none" stroke="url(#greyAtomGradient)" stroke-width="2" opacity="0.6" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="none" stroke="url(#greyAtomGradient)" stroke-width="2" opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="none" stroke="url(#greyAtomGradient)" stroke-width="2" opacity="0.6" transform="rotate(120)"/>
    
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="8" fill="url(#nucleusGradient)" stroke="url(#greyAtomGradient)" stroke-width="1"/>
    
    <!-- Electrons -->
    <circle cx="30" cy="0" r="3" fill="url(#electronGradient)" stroke="url(#greyAtomGradient)" stroke-width="1">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="26" r="3" fill="url(#electronGradient)" stroke="url(#greyAtomGradient)" stroke-width="1">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="-26" r="3" fill="url(#electronGradient)" stroke="url(#greyAtomGradient)" stroke-width="1">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Central glow effect -->
    <circle cx="0" cy="0" r="4" fill="#94a3b8" opacity="0.7"/>
  </g>
</svg> 