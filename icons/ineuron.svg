<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ineuronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Neural network design -->
  <g transform="translate(50,50)">
    <!-- Connection lines -->
    <path d="M -20,-15 L 0,0" stroke="url(#ineuronGradient)" stroke-width="2" opacity="0.8"/>
    <path d="M -20,15 L 0,0" stroke="url(#ineuronGradient)" stroke-width="2" opacity="0.8"/>
    <path d="M 0,0 L 20,-15" stroke="url(#ineuronGradient)" stroke-width="2" opacity="0.8"/>
    <path d="M 0,0 L 20,15" stroke="url(#ineuronGradient)" stroke-width="2" opacity="0.8"/>
    <path d="M -15,-25 L -20,-15" stroke="url(#ineuronGradient)" stroke-width="1.5" opacity="0.6"/>
    <path d="M -15,25 L -20,15" stroke="url(#ineuronGradient)" stroke-width="1.5" opacity="0.6"/>
    <path d="M 15,-25 L 20,-15" stroke="url(#ineuronGradient)" stroke-width="1.5" opacity="0.6"/>
    <path d="M 15,25 L 20,15" stroke="url(#ineuronGradient)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Neural nodes -->
    <circle cx="-20" cy="-15" r="4" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="2"/>
    <circle cx="-20" cy="15" r="4" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="url(#ineuronGradient)"/>
    <circle cx="20" cy="-15" r="4" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="2"/>
    <circle cx="20" cy="15" r="4" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="2"/>
    
    <!-- Outer layer nodes -->
    <circle cx="-15" cy="-25" r="3" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="1.5"/>
    <circle cx="-15" cy="25" r="3" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="1.5"/>
    <circle cx="15" cy="-25" r="3" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="1.5"/>
    <circle cx="15" cy="25" r="3" fill="url(#nodeGradient)" stroke="url(#ineuronGradient)" stroke-width="1.5"/>
    
    <!-- AI brain pattern -->
    <path d="M -2,-3 Q 0,-5 2,-3 Q 4,-1 2,1 Q 0,3 -2,1 Q -4,-1 -2,-3" fill="#ffffff" opacity="0.8"/>
  </g>
</svg> 